## Dovecot's own writable storage. Nothing is seeded from yarilo: the two
## deployments share the userdb, not the mail. A comparison run cleans and
## fills these mailboxes itself, so a copy would only add a slow init and a
## second source of truth for what is in them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dovecot-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.sharedStorage.size }}
